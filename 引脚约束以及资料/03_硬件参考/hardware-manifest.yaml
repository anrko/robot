manifest:
  name: ACG138-RK3588 Hardware Manifest
  version: 0.1
  generated_from:
    - RK3588+GW5AT-60K.NET
    - ACG138-RK3588-CB(1).NET
  excluded_sources:
    - file: allegro.zip
      reason: "Extracted PDF identifies itself as MPSOC-STAR/Xilinx MPSoC design; not treated as ACG138 RK3588 hardware truth."
  rule: "Do not infer unknown pins. Re-derive from the two NET files or board documentation before enabling a DTS node."

soc:
  device: RK3588
  refdes: U1
  debug_uart:
    logical: UART2_M0
    tx:
      connector: P6-19
      core_net: PMU2_GPIO_B5
      rk3588_ball: P29
    rx:
      connector: P6-22
      core_net: PMU2_GPIO_B6
      rk3588_ball: R29

memory:
  dram:
    parts:
      - {refdes: U3, part: K4F8E3S4HD-GHCL}
      - {refdes: U4, part: K4F8E3S4HD-GHCL}
    type: LPDDR4
    note: "DDR training/init comes from RK3588 rkbin loader; validate detected capacity and stability on real board."
  emmc:
    refdes: U5
    part: H26M51002KPR
    nominal_capacity: 16GB
    interface: eMMC 5.1 / HS400-capable

power:
  pmic:
    refdes: U25
    part: RK806-1
    interrupt:
      core_net: PMIC_INT_L
      rk3588_ball: M30
    reset:
      core_net: RESET_L
      rk3588_ball: M31
  external_regulators:
    - {refdes: U7, family: RK860}
    - {refdes: U8, family: RK860}
    - {refdes: U9, family: RK860}

fpga:
  refdes: U10
  part: GW5AT-LV60PG484A
  scope: "Treat RK3588<->FPGA software-visible links as a separate BSP workstream after base SoC bring-up."

ethernet0:
  phy:
    refdes: U19
    part: YT8531C-CA
    interface: RGMII
  signals:
    mdc:      {connector: P5-81, rk3588_ball: AB34}
    mdio:     {connector: P5-83, rk3588_ball: AB33}
    txd3:     {connector: P5-75, rk3588_ball: AC34}
    txd2:     {connector: P5-71, rk3588_ball: AC33}
    txd1:     {connector: P5-69, rk3588_ball: AD34}
    txd0:     {connector: P5-79, rk3588_ball: AD33}
    tx_en:    {connector: P5-77, rk3588_ball: AE34}
    gtx_clk:  {connector: P5-73, rk3588_ball: AE33}
    rxd3:     {connector: P5-76, rk3588_ball: AC31}
    rxd2:     {connector: P5-80, rk3588_ball: AC32}
    rxd1:     {connector: P5-78, rk3588_ball: AD31}
    rxd0:     {connector: P5-72, rk3588_ball: AD32}
    rx_dv:    {connector: P5-70, rk3588_ball: AE31}
    rx_clk:   {connector: P5-74, rk3588_ball: AE32}
    refclk25: {connector: P5-85, rk3588_ball: AD30, note: "DNI/0R option observed; verify population."}
  unresolved:
    - phy_reset_gpio_and_polarity
    - phy_irq_gpio_if_used
    - rgmii_tx_rx_delay_values

micro_sd:
  connector_refdes: J1
  signals:
    d0:  {connector: P3-29, rk3588_ball: AD2}
    d1:  {connector: P3-31, rk3588_ball: AD1}
    clk: {connector: P3-33, rk3588_ball: AE1}
    cmd: {connector: P3-35, rk3588_ball: AE2}
    d3:  {connector: P3-37, rk3588_ball: AF1, note: "Carrier net naming overlaps JTAG_TMS_M0; verify pinmux conflict."}
    d2:  {connector: P3-39, rk3588_ball: AF2, note: "Carrier net naming overlaps JTAG_TCK_M0; verify pinmux conflict."}
    cd:  {connector: P6-85, core_net: SDMMC_DET, rk3588_ball: P31}

pcie:
