camera:
  i2c_mux:
    refdes: U17
    part: PCA9546APWR
    upstream: [CSI_I2C_SCL, CSI_I2C_SDA]
    # 2026-09-21 上板实测（硬件事实，与 DTS 是否打开无关）：
    #   i2cdetect -y -r 3   -> 只有 0x70 应答（0x71..0x77 全无）
    #   i2cget -y 3 0x70 0  -> 0x00  rc=0    （4 通道全关 = PCA9546 上电默认）
    #   i2cget -y 3 0x74 0  -> Error: Read failed  rc=2
    # 网表按 "A0/A1 接地、A2 经 R18 4.7K 上拉" 推算应为 0x74，与实测不符。
    # DTS 一律以实测 0x70 为准；R18 是否实贴留作待查（不臆断）。
    i2c_address: 0x70
    i2c_address_source: "measured 2026-09-21 (i2cget on i2c-3)"
    i2c_address_netlist_guess: 0x74
    downstream:
      - CSI0_I2C_SCL/SDA
      - CSI1_I2C_SCL/SDA
      - CSI2_I2C_SCL/SDA
      - CSI3_I2C_SCL/SDA
  ports:
    - {refdes: FPC2, logical: CSI0, phy_hint: MIPI_DPHY0_RX}
    - {refdes: FPC1, logical: CSI1, phy_hint: MIPI_DPHY1_RX, verify: true}
    - {refdes: FPC5, logical: CSI2, phy_hint: MIPI_DPHY2_RX}
    - {refdes: FPC4, logical: CSI3, phy_hint: MIPI_DPHY3_RX}
  pwdn:
    csi0: {connector: P6-24, core_net: B6_GPIO4_B5, rk3588_ball: AJ26}
    csi1: {connector: P6-30, core_net: B6_GPIO4_B1, rk3588_ball: AL24}
    csi2: {note: "via level shifter; re-trace upstream RK GPIO"}
    csi3: {note: "via level shifter; re-trace upstream RK GPIO"}
  unresolved:
    - sensor_models
    - sensor_i2c_addresses
    - reset_polarities
    - mclk_assignments
    - endpoint_lane_maps

display:
  dsi0:
    connector_refdes: FPC3
    phy_hint: MIPI_DPHY0_TX
    interrupt: {connector: P6-14, rk3588_ball: V29}
    backlight: {connector: P6-38, rk3588_ball: AL26}
  dsi1:
    connector_refdes: FPC6
    phy_hint: MIPI_DPHY1_TX
    interrupt: {connector: P6-16, rk3588_ball: V28}
    backlight: {connector: P6-40, rk3588_ball: AJ27}
  unresolved: [panel_models, reset_gpio_mapping, touch_i2c_addresses, timing_parameters]

hdmi:
  connectors:
    - J5
    - J6
    - J7
  topology: "J5=HDMI0 TX (TX1), J6=HDMI1 TX (TX2), J7=HDMI RX; connector roles confirmed from carrier NET."
  hdmi_rx_control:
    cec_m2: {connector: P3-4, rk3588_ball: E27}
    hpdout_m2: {connector: P3-6, rk3588_ball: E26}
    scl: {connector: P3-38, rk3588_ball: F24}
    sda: {connector: P3-40, rk3588_ball: F25}
    detect_l: {connector: P6-8, rk3588_ball: AC30}
  hdmi_tx_control:
    tx1_cec_m0: {connector: P6-26, rk3588_ball: AK24}
    tx1_on_h:   {connector: P6-32, rk3588_ball: AK25}
    tx0_on_h:   {connector: P6-34, rk3588_ball: AM25}
  control_pin_review_20260922:
    source: "hardware/connector-map.tsv and carrier NET Q5/Q6/Q7/Q14/Q15/Q16/Q19..Q24"
    tx1_j5:
      ddc_scl: {gpio: GPIO3_C7, connector: P4-86, group: hdmim2_tx0_scl}
      ddc_sda: {gpio: GPIO3_D0, connector: P4-84, group: hdmim2_tx0_sda}
      hpd: {gpio: GPIO3_D4, connector: P4-76, group: hdmim1_tx0_hpd}
      cec: {gpio: GPIO4_C1, connector: P6-26, group: hdmim0_tx0_cec}
      enable: {gpio: GPIO4_B3, connector: P6-34, active: high}
    tx2_j6:
      ddc_scl: {gpio: GPIO3_C6, connector: P4-94, group: hdmim1_tx1_scl}
      ddc_sda: {gpio: GPIO3_C5, connector: P4-90, group: hdmim1_tx1_sda}
      hpd: {gpio: GPIO3_B7, connector: P4-98, group: hdmim1_tx1_hpd}
      cec: {gpio: GPIO3_C4, connector: P4-92, group: hdmim2_tx1_cec}
      enable: {gpio: GPIO4_B2, connector: P6-32, active: high}
    rx_j7:
      ddc_scl: {gpio: GPIO1_D6, connector: P3-38, group: hdmim2_rx_scl}
      ddc_sda: {gpio: GPIO1_D7, connector: P3-40, group: hdmim2_rx_sda}
      hpd_output: {gpio: GPIO1_B6, connector: P3-6, group: hdmim2_rx_hpdin, trigger_level: 1}
      cec: {gpio: GPIO1_B7, connector: P3-4, group: hdmim2_rx_cec}
      detect_5v: {gpio: GPIO2_C4, connector: P6-8, active: low}
    note: "Net-name TX1/M0 suffixes differ from RK3588 Linux mux group names; derive groups from SoC pad. EVB work LED on GPIO3_B7 disabled to release TX2 HPD. Mapping review is not functional CEC/RX validation."
  unresolved: [full_hdmi_highspeed_map, cec_functional_validation, rx_capture_validation]

audio:
  codec:
    refdes: U46
    part: ES8388
  i2s0:
    mclk:    {connector: P3-1, rk3588_ball: F30}
    sclk_tx: {connector: P3-3, rk3588_ball: E31}
    lrck_tx: {connector: P3-7, rk3588_ball: D30}
    sdo0:    {connector: P3-11, rk3588_ball: E29}
    sdi1:    {connector: P3-13, rk3588_ball: D28}
  unresolved: [codec_i2c_bus, codec_i2c_address, hp_detect, speaker_amp_control, exact_sound_card_routes]

rtc:
  refdes: U50
  part: BM8563T
  unresolved: [i2c_bus, i2c_address_crosscheck, irq_gpio_if_used]

eeprom:
  refdes: U49
  part: 24LC64
  unresolved: [i2c_bus, i2c_address_from_straps]

fan:
