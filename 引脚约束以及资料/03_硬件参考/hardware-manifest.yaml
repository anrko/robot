# ---------------------------------------------------------------------------
# Phase 2（ACG138 最小可启动 BSP）从网表反查得到的板级事实
#
# 这一节记录的是"设备树里必须写对，否则板子起不来"的那几条。
# 复现命令：
#   python3 tools/parse_netlists.py --refdes U7,U8,U9
#   （注意：U7/U8/U9 在底板网表里是 ESD 管 SRV05-4，核心板里才是 RK860，
#     两份网表位号会重名，反查时要指明是哪一份）
# ---------------------------------------------------------------------------
phase2_dts_resolved:

  pmic_topology:
    fact: "single PMIC"
    evidence: "核心板网表只有一颗 U25 = RK806-1；U7/U8/U9 是三颗外挂 RK860（不是第二颗 PMIC）"
    consequence: >
      U-Boot 的 drivers/power/pmic/rk8xx_spi.c 按**设备树节点名**区分单/双 PMIC
      （单 = rk806single@0，双 = rk806master@0 + rk806slave@1），再与芯片读回的
      RK806_HW_VER 比对（HW_SINGLE_PMIC = 0xe8，HW_DUAL_PMIC = 0x28），
      不一致就直接 run_command("download") 把板子按进 RockUSB 下载模式。
      本板实测读回 0xe8，因此设备树必须是 rk806single@0。
    which_dtb: >
      U-Boot 启动中段会调用 arch/arm/mach-rockchip/kernel_dtb.c 的
      init_kernel_dtb()，把 gd->fdt_blob 换成启动分区里的 rk-kernel.dtb。
      这条校验读的是**内核设备树**，不是 U-Boot 自带的设备树。
    observed_log: "spi2: RK806: 2 / ON=0x40, OFF=0x00 / HW single pmic, the firmware dual pmic(0xe8)!"

  external_bucks:
    # 三颗 RK860 的供电对象、I2C 归属与使能方式，全部由核心板网表反查得到
    - refdes: U7
      part: RK860-2
      output_net: VDD_CPU_BIG0
      consumed_by: "RK3588 U1 balls M16/M17/M19, N16/N17/N19, P16/P17, R16/R17, T16/T17"
      i2c:
        bus_nets: [I2C0_SDA_M2, I2C0_SCL_M2]
        rk3588_balls: [W29, W30]
        dts_mux: i2c0m2_xfer
        address: "0x42"
      enable_net: BIG/NPU_EN
      vsel_net: VSEL2
      vsel_ball: R31
      vin: VCC5V0_SYS
      dts_labels: [vdd_cpu_big0_s0, vdd_cpu_big0_mem_s0]
    - refdes: U8
      part: RK860-3
      output_net: VDD_CPU_BIG1
      consumed_by: "RK3588 U1 balls K23/K24, L23/L24, M23/M24, N23/N24, P23/P24"
      i2c:
        bus_nets: [I2C0_SDA_M2, I2C0_SCL_M2]
        rk3588_balls: [W29, W30]
        dts_mux: i2c0m2_xfer
        address: "0x43"
      enable_net: BIG/NPU_EN
      vsel_net: VSEL6
      vsel_ball: W28
      vin: VCC5V0_SYS
      dts_labels: [vdd_cpu_big1_s0, vdd_cpu_big1_mem_s0]
    - refdes: U9
      part: RK860-2
      output_net: VDD_NPU
      consumed_by: "RK3588 U1 balls AB21/AB22/AB23, AC22/AC23, AD22/AD23, AE22/AE23"
      i2c:
        bus_nets: [I2C2_SDA_M0, I2C2_SCL_M0]
        rk3588_balls: [T31, T28]
        dts_mux: i2c2m0_xfer
        address: "0x42"
      enable_net: BIG/NPU_EN
      vsel_net: VSEL3
      vsel_ball: U32
      vin: VCC5V0_SYS
      dts_labels: [vdd_npu_s0, vdd_npu_mem_s0]
    # 开放问题（同样属于 BLOCKED_HW）：
    #   - VSEL2 / VSEL3 / VSEL6 三档对应的实际电压（需器件手册或实测）
    #   - 0x42 / 0x43 是否可达，需上板 i2cdetect 复核

  external_buck_enable:
    net: BIG/NPU_EN
    members: [U7-A2, U8-A2, U9-A2]
    straps:
      - "R102 -> VCC_3V3（上拉）"
      - "R103 -> GND（下拉）"
    conclusion: "使能由电阻选装决定，网络上没有任何 RK3588 GPIO；固件按 regulator-always-on/boot-on 描述"
    status: "BLOCKED_INFO（哪一支实装需实物确认）"

  pmic_derived_rails:
    # 两条由 RK806-1 自身引出的轨，内核侧按固定轨登记
    - net: VDDA_0V85
      source_pin: U25-10
      series: "R217 0R"
      consumed_by: "RK3588 U1 balls AH13/AH14, AJ13/AJ14, K28/L28/M28（模拟/PLL 供电）"
      dts_label: avdd_0v85_s0
    - net: VCC_1V1_NLDO
      source_pin: "U25-9 / U25-13"
      dts_label: vcc_1v1_nldo_s3
      referenced_by: "rk3588-rk806-single.dtsi 的 vcc13-supply / vcc14-supply"

  usb_controllers:
    dual_role: "Type-C0 的 OTG_ID -> AL14，Type-C1 的 OTG_ID -> AK8；两个 dwc3 控制器置 dr_mode = otg"
    host_only: "USB3 Type-A（J8）没有 ID 信号，置 dr_mode = host"
    vbus_always_on: "J8 的 VBUS 由 U41 使能脚经 R201 4.7K 上拉到 VCC5V0_SYS，硬件常开，无 GPIO"
    why_explicit: >
      U-Boot 的 usb_get_dr_mode() 读不到 dr_mode 会打印
      "usb dr_mode not found" 并返回 UNKNOWN。该阶段 U-Boot 用的同样是内核
      设备树（见 pmic_topology.which_dtb），所以内核 DT 必须显式给出 dr_mode。
    open_questions:
      - "控制器编号与物理口的对应关系（需 RK3588 USB PHY lane↔ball 表）— BLOCKED_INFO"

  display_placeholders:
    reason: >
      基线 rk3588-evb1-lp4-yyt.dtsi 引用了 &backlight / &dsi0_panel /
      &dsi1_panel 三个标签，但它自身及其 include 链并不定义它们（在厂商树里
      由参考板的 LCD 文件提供）。本板屏型号未确认，不能照抄参考板时序，
      因此以 disabled 占位节点提供标签。
    items:
      - {dts_label: backlight, status: disabled}
      - {dts_label: dsi0_panel, status: disabled, known_hw: "DSI0 背光 P6-38 -> ball AL26；MIPI_DSI0_RESET 上游 GPIO1_A6 (C24)"}
      - {dts_label: dsi1_panel, status: disabled, known_hw: "DSI1 背光 P6-40 -> ball AJ27；触摸复位 GPIO1_B4 (E24)"}
    status: "BLOCKED_INFO（panel 型号与初始化时序待确认）"

  phase2_static_verification:
    script: scripts/verify_acg138_dtb.sh
    method: "构建完成后从 update.img 里提取内核 DTB，逐条核对特征（构建 rc=0 不能作为判据：dts 编译失败时构建不报错，会沿用旧 DTB）"
    result: "11/11 PASS（2026-09-20，镜像 ACG138-RK3588-20260920_update.img）"
    scope: "仅静态产物校验；串口日志、rootfs shell、eMMC 识别、50 次冷启动、内存压力仍为 BLOCKED_HW"

