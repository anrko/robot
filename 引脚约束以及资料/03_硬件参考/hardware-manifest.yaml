    pcie30phy:    {dt: "phy@fee80000", users: ["pcie3x4 (pcie@fe150000)"], board_use: "M.2 M-Key U20 x2（Phase 6）"}

  phase5_observations:
    - "第一版（只打开 usbhost3_0/usbhost_dwc3_0，pcie2x1l1 仍为 okay）：xHCI 控制器注册成功，但 U 盘在**任何总线**上都不出现；EHCI fc800000/fc880000 端口读数为 status 501000 / sig=se0"
    - "定位：同一路 combphy2_psu 被 pcie2x1l1 与 usbhost3_0 同时引用，驱动单值 mode 被覆盖（日志 'phy type select 4 overwriting type 2'），SS 链路根本没建立；USB3 设备此时不会退回 USB2，所以在总线上完全看不到设备（这也是当时误判为'供电问题'的原因）"
    - "修复后实测（2026-09-20 20:22 启动日志）：combphy 告警消失；'usb 2-1: new SuperSpeed USB device number 2 using xhci-hcd'；Kingston DataTraveler 3.0（0951:1666，USB 3.20）在 5000 Mbps 枚举为 /dev/sda 62.0GB"
    - "存储：分区 sda1 = NTFS，由 rootfs 的 S50usbdevice.sh 自动挂载为 /mnt/udisk（fuseblk/rw，ntfs-3g）"
    - "读写：256MiB 随机数据写入后清 page cache 回读，sha256 一致（FS_RW_VERIFY_OK）；持续写约 13.8 MB/s、读约 63.8 MB/s（受该 U 盘本身限制，非链路瓶颈）"
    - "裸块级写测试采用'备份→写→校验→恢复→再校验'流程，恢复后再次读取与备份哈希一致（b6e2add4...435d），NTFS 分区内容未被破坏"
    - "拔插复测：J8 上连续 2 次拔插，每次均重新按 SuperSpeed 枚举（设备号 2→3→4），usb-storage 重新绑定并自动挂载回 /mnt/udisk"
    - "第二个 Type-A 口（USB_HOST1，仅 USB2，VBUS 由 U42 供）也在同一轮拔插中被动验证：设备落在 bus 7（EHCI fc880000），speed=480，同样能自动挂载"
    - "调试提示：区分插的是哪个 Type-A 口，看设备落在哪条总线 —— bus 2 = xhci-hcd.3.auto（J8，USB3）；bus 5/7 = EHCI HOST0/HOST1（USB2）"
    - "遗留（非阻塞）：UAS 与 BOT 对照、以及用高速盘测链路吞吐上限，都需要换一支 U 盘才能做"

# ---------------------------------------------------------------------------
# Phase 10 摄像头"出图"（MIPI 采集链路）推进记录 —— 全程远程验证，未依赖用户动手
#
csi_capture_20260921:
  record_scope: "Historical initial attempt; superseded by reports/camera-bringup-20260921.md. Not current topology or blocker."
  remote_update_method: >-
    内核与 DTB 都在 boot 分区（mmcblk0p3）。用法：wget boot.img（HTTP，板子 eth0 直连
    电脑 192.168.0.3:8899）→ dd if=/tmp/boot.img of=/dev/mmcblk0p3 bs=1M → sync → reboot。
    可在不烧录整镜像的情况下迭代内核/设备树，约 5 分钟一轮。
  dts_chain: "ov5647_0 → csi2_dphy1 → mipi2_csi2 → rkcif_mipi_lvds2（候选#1；配对表见 dtsi 注释）"
  dts_result: >-
    PASS（拓扑层）—— media 实测全链路 ENABLED：
    ov5647 9-0036(/dev/v4l-subdev2) → rockchip-csi2-dphy1(/dev/v4l-subdev1)
    → rockchip-mipi-csi2(/dev/v4l-subdev0) → stream_cif_mipi_id0(/dev/video0)；
    /dev/video0..video11 与 /dev/media0 均已创建；
    日志："rockchip-csi2-dphy csi2-dphy1: dphy1 matches ov5647 9-0036:bus type 5"。
  driver_gap_fixed: >-
    mainline ov5647 驱动只有 .s_stream，缺 Rockchip 需要的两个回调：
      "csi2-dphy1: ov5647 9-0036 get_mbus_config fail, pls check it"
      "rkcif-mipi-lvds2: ... g_frame_interval failed!"
    已补 ov5647_get_mbus_config（CSI2 DPHY / 2 lane / 连续时钟→flags=0）与
    ov5647_g_frame_interval（标称 30fps）；重新导出为
    patches/kernel/0002-ov5647-accept-24mhz-xclk.patch（1230→3008 字节）。
    补后两条报错计数归零，dphy1 probe successfully。
  build_trap_seen: >-
    补丁第一版用了不存在的宏 V4L2_MBUS_CSI2_CONTINUOUS_CLOCK → 内核编译报错，
    但外层 vm_task 仍返回 rc=0 并把**旧内核**重新打包成"新"boot.img
    （compile.sh 的 try_func 吞掉步骤失败）。表现为"推上新内核后报错依旧"。
    教训：每次构建后必须查 /tmp/acg138-kernel-only.log 的 error: 计数、
    KERNEL_STEP_EXIT，以及 Image / ov5647.o 的 mtime。
  current_blocker: >-
    STREAMON 失败："rkcif-mipi-lvds2: crop size is bigger than input"。
    已验证 sensor/mipi-csi2 pad0 均为 640x480 SBGGR10；
    v4l2-ctl --set-subdev-fmt 对各 subdev 均 rc=0；
    --set-selection 设 crop 也被接受（日志 "static crop, S_SELECTION(640x480@0:0)"）；
    换成 1920x1080 同样报错 → 说明 CIF 算出的 input 尺寸是 0，而不是 crop 真的大。
    怀疑点：rkcif_get_input_fmt() 先调 RKMODULE_GET_CHANNEL_INFO，OV5647 未实现；
    若内核返回 0（而非 -ENOIOCTLCMD），CIF 会采用全 0 的 ch_info → input=0。
    下一步：给 ov5647 补 RKMODULE_GET_CHANNEL_INFO，或在 CIF 侧校验 ch_info 非零。
  media_ctl_note: >-
    media-ctl -d /dev/media0 -V '<entity>:<pad>[fmt:...]' 在本板一律返回
    "Unable to setup formats: Invalid argument (22)"；
    改用 v4l2-ctl --set-subdev-fmt pad=N,width=,height=,code=0x3007 可正常设置。

# ---------------------------------------------------------------------------
# Phase 12 音频：实物模拟环回实测（2026-09-21，用户用一根线对接 Line Out↔Line In）
#
audio_loopback_20260921:
  hardware_evidence: >-
    用户提供 ES8388 原理图：OUT1 = LOUT1(pin12)/ROUT1(pin11) 经 C171 47uF + R303/R306 470R
    输出；IN1 = 经 R311/R312 4.7K + C175/C176 2.2uF 接 LIN1(pin24)/RIN1(pin23)。
    LOUT2/ROUT2/LIN2/RIN2 全部未接（图上打叉）——所以采集必须选 LIN1/RIN1。
  mixer_state: >-
    amixer -c 1 实测：'Left Line Mux'(numid=47) 四选项为 'Line 1L'/'Line 2L'/'NC'/'MicL'，
    当前值 0 = 'Line 1L' ✓ 与原理图一致（无需修改）；
    'Headphone Switch'(39)=on、'Left Mixer Left Playback Switch'(49)=on、'Capture Mute'(26)=off。
  test_method: >-
    板上用 GStreamer 合成测试音从 hw:1,0 播放，同时 arecord 录制（同一张 card1），
    再直接读 WAV 采样值判断有无信号。
  result: >-
    PASS —— 单声道 1kHz 版本：录音 960044 字节（5 秒整），采样值呈清晰正弦
    （5095→4383→3181→…→-5422），峰值 10005~10009（约 -10 dBFS）；
    加 audioconvert 后的立体声版本：左峰值 11711、右峰值 9346，双声道均有信号。
    证明「DAC → OUT1 → 对接线 → IN1 → LIN1/RIN1 → ADC」整条模拟链路可用。
  pitfall: >-
    第一版测试右声道恒为 0，一开始怀疑硬件/线是单声道；实际原因是 GStreamer 链里
    audiotestsrc 为单声道且没有 audioconvert，caps 改成 channels=2 并没有真正上混。
    加 audioconvert 后左右都有信号 —— 排除了"右声道硬件坏"的误判。
  open_items:
    - "左右幅度差约 1.25 倍（11711 vs 9346），需用定幅信号标定 PGA/输出增益后再判是否正常"
    - "频响平坦度 / THD / SNR / 串扰的量化分析：把 WAV 拉回虚拟机做 FFT 即可补上"
