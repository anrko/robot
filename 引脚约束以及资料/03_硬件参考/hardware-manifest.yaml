  phy_group: PCIE20_0/SATA30_0 combo
  rx_p: {connector: P2-47, rk3588_ball: N33}
  rx_n: {connector: P2-49, rk3588_ball: N34}
  tx_p: {connector: P2-48, rk3588_ball: M34}
  tx_n: {connector: P2-50, rk3588_ball: M33}

usb3_type_a:
