# ---------------------------------------------------------------------------
# Phase 5：USB 主机口（J8 = USB3 Type-A）反查结果（2026-09-20，纯网表 + 内核源码确认）
#
# 复现命令：
#   python tools/net_query.py --board carrier comp J8 U41 U34 U38 R201 R203
#   python tools/net_query.py --board som net USB20_HOST0_D_P
# ---------------------------------------------------------------------------
phase5_resolved:
  usb3_type_a_j8:
    connector_refdes: J8
    part: "HC-USB3.0-L257-P（USB3.0 Type-A 母座）"
    superspeed_tx: "J8-8/9 (StdA_SSTX_N/P) -> C143/C144 0.1uF 交流耦合 -> 底板网 PCIE20_2_TX_N/P -> 核心板 P2-59/61 -> U1-H29/H30"
    superspeed_rx: "J8-5/6 -> 底板网 PCIE20_2_RX_N/P -> 核心板 P2-56/54 -> U1-J30/J31"
    usb2_dm: "J8-2 -> USB20_HOST0_D_N -> P4-99 -> U1-AL6"
    usb2_dp: "J8-3 -> USB20_HOST0_D_P -> P4-97 -> U1-AK6"
    vbus: "J8-1 = USB_VBUS3 <- U41 (DIO7002AST5) pin 1（负载开关输出）"
    otg_id: "无（纯主机口，dr_mode 必须为 host）"

  usb3_vbus_switch:
    refdes: U41
    part: DIO7002AST5
    topology: "pin5 = VIN = VCC5V0_SYS；pin1 = VOUT = USB_VBUS3；pin2 = GND；pin3 = 限流设置脚（R203 6.8K -> GND）；pin4 = EN"
    enable: "pin4 经 R201 4.7K 上拉到 VCC5V0_SYS —— 无 RK3588 GPIO，硬件常开"
    pinout_proof: >-
      U34/U38（两颗同型号，Type-C0/Type-C1 的 VBUS 开关）的 pin4 分别由
      USB_EN0（U14-13，来自 GPIO3_B6）和 USB_EN1（U14-12，来自 GPIO3_D1）驱动，
      说明 pin4 就是 EN；U41/U42 的 pin4 没有 GPIO，只接 R201/R202 上拉，
      因此设计意图就是"常开"。
    sibling: "U42 (DIO7002AST5) -> USB_VBUS4 -> 另一个 Type-A 口 USB_HOST1-1"
    status: "netlist-confirmed；上板实测仍未枚举到设备，见 phase5_observations"

  usb2_typea_second_port:
    connector_refdes: USB_HOST1
    note: "底板上还有第二个 Type-A 口（仅 USB2），VBUS 由 U42 供，信号为 USB20_HOST1_D_P/N -> P4-91/93 -> U1-AL7/AM7"
    use: "可作为 J8 的对照口，用来区分'U 盘/供电问题'与'J8 专属问题'"

