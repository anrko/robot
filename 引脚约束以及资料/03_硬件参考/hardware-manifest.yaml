    connector: P6-20
    core_net: PMU2_GPIO_C6
    rk3588_ball: T29

validation_policy:
  states: [PASS, FAIL, BLOCKED_HW, BLOCKED_INFO, NOT_RUN]
  rule: "No feature is PASS until tested on physical ACG138 hardware with captured logs."

# ---------------------------------------------------------------------------
# Phase 0 网表反查结果（2026-09-19）
# 来源：hardware/source/RK3588+GW5AT-60K.NET 与 hardware/source/ACG138-RK3588-CB.NET
# 工具：tools/parse_netlists.py
# 详细证据：reports/phase0-netlist-check.md 与 logs/phase-0/*.txt
#
# 注意：以下结论全部来自网表本身，尚未在实物上验证，因此不是 PASS，
# 只是"已从原始网表确认"的硬件事实，用于编写 DTS。
# ---------------------------------------------------------------------------
phase0_resolved:
  method: "netlist trace (tools/parse_netlists.py --trace / --net)"
  confidence: "netlist-confirmed; not yet board-verified"

  ethernet0_phy_reset:
    chain: "U19-12 -> R82(0R) -> ENET0_RESET -> P4-78 -> B5_GPIO3_B2 -> U1-AE28"
    rk3588_gpio: GPIO3_B2
    rk3588_ball: AE28
    core_net: B5_GPIO3_B2
    carrier_net: ENET0_RESET
    pull: "R83 4.7K to VCC_1V8 (deasserted high, reset active low)"
    note: "Resolves prior unresolved item phy_reset_gpio_and_polarity. Still needs scope/board confirmation of timing."

  ethernet0_phy_straps:
    observations:
      - "U19 pin 36/37: 25MHz crystal Y3 (C50/C51 load caps), not the 25MHz REFCLK path"
      - "U19 pin 31: R77 4.7K pull-up to VCC_1V8"
      - "U19 pin 35: R81 4.7K pull-down to GND"
      - "U19 pin 39: R84 2.49K 1% to GND (bias/RSET type pin)"
    note: "Strap polarity must still be read against the YT8531 datasheet before setting rgmii delays."

  ethernet0_leds:
    mapping: "ETH0_PHY_LED0/1/2 -> U19 pin 32/33/34 -> R72/R74/R76 -> J3 (LED header)"

  pcie_x1_j4_perst:
    chain: "U14 pin 14 -> PCIE_PERST -> J4-A11 (and R98 -> U14 area)"
    driven_by: "U14 = SN74AVC4T774PWR (netlist is authoritative), channel A1(3) <-> B1(14)"
    rk3588_gpio: GPIO3_C1
    rk3588_ball: Y27
    core_net: B5_GPIO3_C1
    note: "Netlist-authoritative per hardware owner decision 2026-09-19. Pin-name mapping comes from the project's own AVC4T774PWR symbol; re-check when the matching schematic revision is available."

  typec_vbus_enable:
    typec0: "USB_EN0 -> U34 (DIO7002AST5) pin 4; load switch output USB_VBUS1 -> U33 pin 2 and Type-C0 VBUS"
    typec1: "USB_EN1 -> U38 (DIO7002AST5) pin 4; load switch output USB_VBUS2 -> Type-C1 VBUS"
    source_of_USB_EN: "U14 (SN74AVC4T774PWR) channel A2(4)<->B2(13) and A3(5)<->B3(12)"
    typec0_enable_gpio: "GPIO3_B6"
    typec0_enable_ball: AE29
    typec1_enable_gpio: "GPIO3_D1"
    typec1_enable_ball: AG23
    rk_key0_gpio: "GPIO3_C0"
    rk_key0_ball: Y29
    note: "U14 channel A4(6)<->B4(11) drives RK_KEY0; DIR4 and OE# are tied to GND, so the device is always enabled."

  usb3_typea_vbus:
    chain: "U41 (DIO7002AST5) pin 1 -> USB_VBUS3 -> J8-1"
    enable: "U41 pin 4 = NetR201_1 -> R201 4.7K -> VCC5V0_SYS only; no RK3588 GPIO"
    conclusion: "J8 VBUS is permanently enabled by a hardware pull-up; there is no software VBUS control for this port"
    verify: "confirm the load-switch enable polarity against the DIO7002AST5 datasheet"
    usb2_companion: "J8 pin 2/3 -> USB20_HOST0_D_N/P -> U1-AL6 / U1-AK6"
    usb3_superspeed: "J8 pin 8/9 = StdA_SSTX_N/P; SoM side is PCIE20_2_TX_N/P -> U1-H29/H30 via AC coupling C143/C144"
    usb3_receive: "J8 pin 5/6 = PCIE20_2_RX_N/P -> U1-J30/J31"

  rtc_and_eeprom_i2c:
    bus: I2C1_M4
    chain: "U1 I2C1_SDA_M4/SCL_M4 -> U54 (PCA9306DP1 level translator) -> IIC_SDA/IIC_SCL (3.3V) -> U49 (24LC64) / U50 (BM8563T) / DSI0 touch (FPC3-22 via R330/R329 0R)"
    pullups: "R266/R267 4.7K to VCC_3V3; R164/R165 4.7K on the touch branch"
    note: "Resolves prior unresolved items rtc.i2c_bus and eeprom.i2c_bus. I2C addresses still need datasheet/strap confirmation and a bus scan on hardware."

  audio_es8388:
    codec: "U46 ES8388 (I2C pins still to be traced; digital audio now confirmed)"
    i2s0_map:
      - "U46 pin 1  -> R305 33R -> I2S0_MCLK    -> P3-1  -> B1_GPIO1_C2 -> U1-F30"
      - "U46 pin 5  -> R307 33R -> I2S0_SCLK_TX -> P3-3  -> B1_GPIO1_C3 -> U1-E31"
      - "U46 pin 7  -> R308 33R -> I2S0_LRCK_TX -> P3-7  -> B1_GPIO1_C5 -> U1-D30"
      - "U46 pin 6  -> R309 33R -> I2S0_SDO0    -> P3-11 -> B1_GPIO1_C7 -> U1-E29"
      - "U46 pin 8  -> R310 33R -> I2S0_SDI1    -> P3-13 -> B1_GPIO1_D4 -> U1-D28"
    unresolved_after_phase0: [codec_i2c_bus, codec_i2c_address, hp_detect, speaker_amp_control]

  hdmi_connector_roles:
    J5: "HDMI0 TX (nets HDMI0_TX0..3*_PORT, HDMI0_TX_CEC_PORT, HDMI0_TX_SCL/SDA_PORT, HDMI0_5V)"
    J6: "HDMI1 TX (nets HDMI1_TX0..3*_PORT, HDMI1_TX_CEC_PORT, HDMI1_TX_SCL/SDA_PORT, HDMI1_5V)"
    J7: "HDMI0 RX (nets HDMI0_RX0..2*, HDMI0_RX_CLK*, HDMI0_RX_CEC_PORT, HDMI0_RX_HPD_PORT, HDMI0_RX_PORT_5V)"
    note: "Resolves connector_role_crosscheck from the netlist. High-speed pair to ball mapping still to be extended."

  camera_and_dsi_level_shift:
    csi0_pwdn: "P6-24 / FPC2-3 / R169 4.7K pull-down  -> already known GPIO4_B5 (AJ26)"
    csi1_pwdn: "P6-30 / FPC1-3 / R170 4.7K pull-down  -> already known GPIO4_B1 (AL24)"
    csi2_pwdn: "U35 (SN74AVC4T774PWR) pin 12 -> CSI2_PWDN -> FPC5-3, R177 4.7K pull-down"
    dsi0_ct_reset: "U35 pin 13 -> DSI0_CT_RESET"
    dsi0_reset: "U35 pin 11 -> MIPI_DSI0_RESET"
    level_shifter_inputs: "U35 pin 4/5/6 = B4_GPIO1_B4 (E24) / B4_GPIO1_B1 (D25) / B4_GPIO1_A6 (C24)"
